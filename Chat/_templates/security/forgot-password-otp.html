<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification - Forgot Password | Security | ChitChat</title>

    <link rel="icon" type="image/x-icon" href="happy-facess.png" />

    <!-- bootstrap link and script -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- bootstrap and fontawesome icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Berkshire+Swash&family=Cinzel:wght@400..900&family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Geist:ital,wght@0,100..900;1,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

    <style>
      * {
        font-family: "EB Garamond";
        /* font-family: 'PT Sans'; */
      }

      header a {
        /* font-family: 'Berkshire Swash', 'Cinzel'; */
        font-family: "Cinzel" !important;
      }
    </style>

    <style>
      body {
        /* background-color: #f4f7f6; */
        /* height: 100vh; */
        /* display: flex; */
        /* align-items: center; */
        /* justify-content: center; */
      }

      .otp-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
        border: 1px solid #f2f2f2;
        border-radius: 15px;
        box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
      }

      .icon-box {
        width: 70px;
        height: 70px;
        background-color: #e7f1ff;
        color: #0d6efd;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px auto;
        font-size: 2rem;
      }

      /* OTP Input Boxes Custom Styling */
      .otp-input-fields {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin: 25px 0;
      }

      .otp-field {
        width: 50px;
        height: 50px;
        font-size: 1.5rem;
        text-align: center;
        border-radius: 8px;
        border: 1px solid #dee2e6;
        background-color: #f8f9fa;
        font-weight: 600;
      }

      .otp-field:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        outline: none;
        background-color: #fff;
      }

      /* Hide Spinner arrows in Input number */
      .otp-field::-webkit-inner-spin-button,
      .otp-field::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      /* OTP Inputs Custom Styling */
      .otp-field {
        height: 50px;
        /* आपकी पसंद का बड़ा साइज़ */
        font-size: 1.4rem;
        text-align: center;
        padding: 0;
        border-radius: 8px;
        border: 1px solid #dee2e6;
        background-color: #f8f9fa;
        font-weight: 600;
      }

      /* फ़ोकस होने पर बॉर्डर कलर बदलना */
      .otp-field:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        outline: none;
        background-color: #fff;
      }

      /* नंबर इनपुट के ऊपर-नीचे वाले तीर (Spinners) हटाना */
      .otp-field::-webkit-inner-spin-button,
      .otp-field::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
    </style>






<!-- chat scrolls -->
<style>


  

/* ================================
   Custom Body Scrollbar
   ================================ */

html{
    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: #f0f0f0 transparent;
    scrollbar-color: #d0d0d0 transparent;
    /* background-color: red !important; */
}

/* Chrome / Edge / Safari */
html::-webkit-scrollbar {
    width: 5px !important;
}

/* Scrollbar background */
html::-webkit-scrollbar-track {
    background: transparent;
}

/* Actual scrollbar handle */
html::-webkit-scrollbar-thumb {
    background-color: #f0f0f0;
    border-radius: 0;
    transition: background-color 0.2s ease;
}

/* Cursor scrollbar area par aaye */
html::-webkit-scrollbar-thumb:hover {
    background-color: #9ca3af;
}

/* Arrows/buttons remove */
html::-webkit-scrollbar-button {
    display: none;
    width: 0;
    height: 0;
}



</style>







  </head>

  <body>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card otp-card p-4">
            <div class="card-body text-center">

              <!-- Top Shield/Key Icon -->
              <div class="icon-box">
                <i class="fa-solid fa-shield-halved"></i>
              </div>

              <h3 class="card-title fw-bold text-dark mb-2">Verification Code</h3>
              <p class="text-secondary small mb-1">We have sent a verification code to</p>
              <p class="fw-semibold text-dark small mb-4">
                <span class="text-primary mb-4 d-block">{{identifier}}</span>
              </p>

              <!-- OTP Form -->
              <form class="text-start" method="POST" action="/security/forgot-password/otp/" id="otpForm">
                {% csrf_token %}
                <!-- Hidden input for identifier -->
                <input type="hidden" name="identifier" value="{{ identifier }}">

                <!-- 6 Digit OTP Inputs Grid -->
                <div class="row g-2 my-4 justify-content-center mx-auto" style="max-width: 340px;">
                  <div class="col-2">
                    <input type="number" class="form-control otp-field" id="otp1" required autocomplete="off" autofocus>
                  </div>
                  <div class="col-2">
                    <input type="number" class="form-control otp-field" id="otp2" required autocomplete="off">
                  </div>
                  <div class="col-2">
                    <input type="number" class="form-control otp-field" id="otp3" required autocomplete="off">
                  </div>
                  <div class="col-2">
                    <input type="number" class="form-control otp-field" id="otp4" required autocomplete="off">
                  </div>
                  <div class="col-2">
                    <input type="number" class="form-control otp-field" id="otp5" required autocomplete="off">
                  </div>
                  <div class="col-2">
                    <input type="number" class="form-control otp-field" id="otp6" required autocomplete="off">
                  </div>
                </div>

                <!-- Verify Button -->
                <button type="submit" id="verifyBtn" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                  Verify OTP
                </button>
              </form>

              <!-- Resend Option -->
              <div class="mt-3">
                <span class="text-secondary small">Didn't receive the code?</span>
                <a href="#" class="text-decoration-none small fw-semibold ms-1">Resend</a>
              </div>

              <!-- Back to Login -->
              <div class="mt-3">
                <a href="login.html" class="text-decoration-none small fw-semibold">
                  <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
                </a>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    {% if messages %}
    <div class="toast-container position-fixed bottom-0 end-0 p-3">

      {% for message in messages %}

      <div class="toast align-items-center text-bg-{{message.tags}} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            {{ message }}
          </div>

          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
          </button>
        </div>
      </div>
      {% endfor %}

    </div>
    {% endif %}

    <div class="toast-container position-fixed bottom-0 end-0 p-3">

      {% for message in messages %}

      <div class="toast align-items-center text-bg-{{ message.tags }} border-0 mb-2" role="alert" data-bs-delay="3000">
        <div class="d-flex">

          <div class="toast-body">
            {{ message }}
          </div>

          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
          </button>

        </div>
      </div>

      {% endfor %}

    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const otpFields = document.querySelectorAll('.otp-field');
        const verifyBtn = document.getElementById('verifyBtn');
        const otpForm = document.getElementById('otpForm');
        otpFields.forEach((field, index) => {
          // 1. आगे बढ़ने का लॉजिक (Typing Forward)
          field.addEventListener('input', function(e) {
            // सिर्फ 1 डिजिट की अनुमति दें
            if (this.value.length > 1) {
              this.value = this.value.slice(0, 1);
            }
            // अगर नंबर टाइप हुआ है, तो अगले बॉक्स पर जाएं
            if (this.value.length === 1) {
              if (index < otpFields.length - 1) {
                otpFields[index + 1].focus();
              } else {
                verifyBtn.focus(); // 6ठा बॉक्स भरने पर सीधे बटन पर जाएं
              }
            }
          });
          // 2. पीछे लौटने का लॉजिक (Backspace Handle)
          field.addEventListener('keydown', function(e) {
            if (e.key === "Backspace") {
              // अगर करंट बॉक्स खाली है, तो बैकस्पेस दबाने पर पिछले बॉक्स में जाएं और उसे साफ करें
              if (this.value === "") {
                if (index > 0) {
                  otpFields[index - 1].focus();
                  otpFields[index - 1].value = "";
                }
              } else {
                // अगर करंट बॉक्स में नंबर है, तो पहली बार में सिर्फ उसे डिलीट करें
                this.value = "";
              }
              e.preventDefault(); // डिफॉल्ट बिहेवियर रोकें ताकि स्मूथ बैकस्पेस काम करे
            }
          });
        });
        // 3. स्मार्ट पेस्ट हैंडलर (Smart Clipboard Paste)
        document.getElementById('otp1').addEventListener('paste', function(e) {
          let pasteData = (e.clipboardData || window.clipboardData).getData('text');
          pasteData = pasteData.replace(/[^0-9]/g, ''); // सिर्फ नंबर्स रखें
          if (pasteData.length > 0) {
            otpFields.forEach((field, index) => {
              if (pasteData[index]) {
                field.value = pasteData[index];
              }
            });
            // अगर 6 डिजिट पेस्ट हुए हैं तो बटन पर फोकस करें
            if (pasteData.length >= 6) {
              verifyBtn.focus();
            } else {
              otpFields[pasteData.length - 1].focus();
            }
            e.preventDefault();
          }
        });
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.querySelectorAll('.toast').forEach(toast => {
        new bootstrap.Toast(toast).show();
      });
    </script>

  </body>

</html>
