<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- icon -->
    <!-- <link rel="icon" type="image/x-icon" href="happy-facess.png" /> -->
    <link rel="icon" type="image/x-icon" href="/_uploads/icon/happy-facess.png" />

    <title>Reset Password | Security | ChitChat</title>

    <!-- bootstrap link and script -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- bootstrap and fontawesome icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Berkshire+Swash&family=Cinzel:wght@400..900&family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Geist:ital,wght@0,100..900;1,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

    <style>
      * {
        font-family: "EB Garamond";
        /* font-family: 'PT Sans'; */
      }

      header .self-font-cinzel,
      header .self-font-cinzel a {
        /* font-family: 'Berkshire Swash', 'Cinzel'; */
        font-family: "Cinzel" !important;
      }
    </style>

    <style>
      body {
        /* background-color: #f4f7f6; */
        /* height: 100vh; */
        /* display: flex; */
        /* align-items: center; */
        /* justify-content: center; */
      }

      .signup-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
        border: 1px solid #f2f2f2;
        border-radius: 15px;
        box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
      }

      .btn-google {
        background-color: #db4437;
        color: white;
      }

      .btn-google:hover {
        background-color: #c23325;
        color: white;
      }

      .btn-facebook {
        background-color: #3b5998;
        color: white;
      }

      .btn-facebook:hover {
        background-color: #2d4373;
        color: white;
      }

      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #888;
      }

      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid #dee2e6;
      }

      .divider:not(:empty)::before {
        margin-right: .25em;
      }

      .divider:not(:empty)::after {
        margin-left: .25em;
      }
    </style>





<!-- chat scrolls -->
<style>


  

/* ================================
   Custom Body Scrollbar
   ================================ */

html{
    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: #f0f0f0 transparent;
    scrollbar-color: #d0d0d0 transparent;
    /* background-color: red !important; */
}

/* Chrome / Edge / Safari */
html::-webkit-scrollbar {
    width: 5px !important;
}

/* Scrollbar background */
html::-webkit-scrollbar-track {
    background: transparent;
}

/* Actual scrollbar handle */
html::-webkit-scrollbar-thumb {
    background-color: #f0f0f0;
    border-radius: 0;
    transition: background-color 0.2s ease;
}

/* Cursor scrollbar area par aaye */
html::-webkit-scrollbar-thumb:hover {
    background-color: #9ca3af;
}

/* Arrows/buttons remove */
html::-webkit-scrollbar-button {
    display: none;
    width: 0;
    height: 0;
}



</style>






  </head>

  <body>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card signup-card p-4">
            <div class="card-body">
              <h3 class="card-title text-center mb-4 fw-bold text-dark">Reset Password</h3>

              <!-- Reset Password Form -->
              <form method="POST" action="{% url 'reset_password' %}">
                {% csrf_token %}
                <!-- Full Name Input -->
                <div class="mb-3">
                  <label for="identifier" class="form-label">Username / Email Address</label>
                  <input type="text" class="form-control" id="identifier" name="identifier!" autofocus value="{{ identifier | default:'root' }}" disabled required>
                </div>

                <input type="hidden" name="identifier" value="{{ identifier | default:'root' }}">

                <!-- Password Input -->
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" placeholder="Create strong password" required>
                </div>

                <!-- Confirm Password Input -->
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">Confirm Password</label>
                  <input type="password" class="form-control" id="confirmPassword" name="confirm_password" autocomplete="new-password" placeholder="Repeat your password" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-3">Reset Password</button>
              </form>

              <!-- Login Link -->
              <div class="text-center mt-4">
                <span class="text-secondary small">Already have an account?</span>
                <a href="/security/login/" class="text-decoration-none small fw-semibold"> Sign In</a>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    {% if messages %}
    <div class="toast-container position-fixed bottom-0 end-0 p-3">

      {% for message in messages %}

      <div class="toast align-items-center text-bg-{{message.tags}} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            {{ message }}
          </div>

          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
          </button>
        </div>
      </div>
      {% endfor %}

    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.querySelectorAll('.toast').forEach(toast => {
        new bootstrap.Toast(toast).show();
      });
    </script>

  </body>

</html>
