<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Security | ChitChat</title>

    <!-- icon -->
    <!-- <link rel="icon" type="image/x-icon" href="https://i.fbcd.co/products/resized/resized-1500-1000/1907-m10-i006-n001-e01p-d478efea6152c427f222b1c0d046ec794b9d80c3765b803c348deb32ed2df138.webp" /> -->
    <link rel="icon" type="image/x-icon" href="happy-facess.png" />

    <!-- bootstrap link and script -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- bootstrap and fontawesome icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amita:wght@400;700&family=Berkshire+Swash&family=Cinzel:wght@400..900&family=Dancing+Script:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Geist:ital,wght@0,100..900;1,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />

    <style>
      * {
        font-family: "EB Garamond";
        /* font-family: 'PT Sans'; */
      }

      header a {
        /* font-family: 'Berkshire Swash', 'Cinzel'; */
        font-family: "Cinzel" !important;
      }
    </style>

    <style>
      body {
        /* background-color: #f4f7f6; */
        /* height: 100vh; */
        /* display: flex; */
        /* align-items: center; */
        /* justify-content: center; */
      }

      .forgot-card {
        border: none;
        border-radius: 15px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1);
        border: 1px solid #f2f2f2;
        border-radius: 15px;
        box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.1);
      }

      .icon-box {
        width: 70px;
        height: 70px;
        background-color: #e7f1ff;
        color: #0d6efd;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px auto;
        font-size: 2rem;
      }
    </style>





<!-- chat scrolls -->
<style>


  

/* ================================
   Custom Body Scrollbar
   ================================ */

html{
    /* Firefox */
    scrollbar-width: thin;
    scrollbar-color: #f0f0f0 transparent;
    scrollbar-color: #d0d0d0 transparent;
    /* background-color: red !important; */
}

/* Chrome / Edge / Safari */
html::-webkit-scrollbar {
    width: 5px !important;
}

/* Scrollbar background */
html::-webkit-scrollbar-track {
    background: transparent;
}

/* Actual scrollbar handle */
html::-webkit-scrollbar-thumb {
    background-color: #f0f0f0;
    border-radius: 0;
    transition: background-color 0.2s ease;
}

/* Cursor scrollbar area par aaye */
html::-webkit-scrollbar-thumb:hover {
    background-color: #9ca3af;
}

/* Arrows/buttons remove */
html::-webkit-scrollbar-button {
    display: none;
    width: 0;
    height: 0;
}



</style>






  </head>

  <body>

    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card forgot-card p-4">
            <div class="card-body text-center">

              <!-- Top Lock Icon -->
              <div class="icon-box">
                <i class="fa-solid fa-lock-open"></i>
              </div>

              <h3 class="card-title fw-bold text-dark mb-2">Forgot Password?</h3>
              <p class="text-secondary small mb-4">
                Enter your registered email address below, and we'll send you instructions to reset your password.
              </p>

              <!-- Forgot Password Form -->
              <form class="text-start" method="POST" action="/security/forgot-password/">
                {% csrf_token %}
                <!-- Email Input -->
                <div class="mb-4">
                  <label for="identifier" class="form-label">Email Address</label>
                  <input type="text" class="form-control" id="identifier" name="identifier" placeholder="name@example.com" value="{{ identifier }}" autofocus required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                  Send Reset Link
                </button>
              </form>

              <!-- Back to Login Link -->
              <div class="mt-3">
                <a href="login.html" class="text-decoration-none small fw-semibold">
                  <i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In
                </a>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>

    {% if messages %}
    <div class="toast-container position-fixed bottom-0 end-0 p-3">

      {% for message in messages %}

      <div class="toast align-items-center text-bg-{{message.tags}} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">
            {{ message }}
          </div>

          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast">
          </button>
        </div>
      </div>
      {% endfor %}

    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.querySelectorAll('.toast').forEach(toast => {
        new bootstrap.Toast(toast).show();
      });
    </script>

  </body>

</html>
